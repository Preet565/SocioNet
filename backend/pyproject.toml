[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "npc-internet-backend"
version = "0.1.0"
description = "Deterministic local backend for NPC Internet: The Butterfly Effect"
requires-python = ">=3.12.8,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.4",
    "uvicorn==0.52.4",
]

[project.optional-dependencies]
test = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["."]
