services:
  api:
    build:
      context: ./backend
    environment:
      SOCIONET_DB_PATH: /app/data/socionet.sqlite3
      SOCIONET_CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    ports:
      - "8000:8000"
    volumes:
      - socionet-data:/app/data

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  socionet-data:
